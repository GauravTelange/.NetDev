# CustomerApplication - reverse proxy to Kestrel (matches Questpond-style Apache + MVC lab)
# Kestrel must be running first: see ..\start-kestrel.bat

<VirtualHost *:80>
    ServerName localhost

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass        / http://127.0.0.1:5005/
    ProxyPassReverse / http://127.0.0.1:5005/

    ErrorLog "logs/customerapp-error.log"
    CustomLog "logs/customerapp-access.log" common
</VirtualHost>
